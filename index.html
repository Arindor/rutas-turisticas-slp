      let bounds=L.latLngBounds(sequence.map(id=>[points[id].lat,points[id].lng]));map.fitBounds(bounds.pad(.3),{maxZoom:16,paddingTopLeft:[Math.min(390,innerWidth*.35),10]});
    }
    document.getElementById('route-v3').onclick=()=>draw();
    origin.onchange=()=>draw();cat.onchange=()=>draw();draw();
    })();</script>
